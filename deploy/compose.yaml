# Production on the server: the app and its own PostgreSQL, compose project "prod".
# Every deploy copies deploy/ to /opt/personal-crm/deploy; run it only through crm-deploy,
# which sets APP_TAG. Secrets come from /opt/personal-crm/.env (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
# BETTER_AUTH_SECRET, SMTP_URL, OWNER_EMAIL); a missing one stops the deploy at its first step.
name: prod

# Container logs: at most 3 files of 10 MB each
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Values of failed queries must not reach this log. Errors of queries go only
    # to the log of the app; what stays here (start, stop, severe failures) has
    # one line per event, without details and without the text of the query.
    # Changing this recreates the container on the next deploy; the data stays
    command:
      - postgres
      - -c
      - log_min_messages=log
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No published port: only the app container reaches the database
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: while a new database initializes, Postgres listens on its socket only
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    # Built by GitHub Actions and tagged with the commit SHA; crm-deploy pulls it, compose never does
    image: ghcr.io/averjuli/personal-crm:${APP_TAG:?run through crm-deploy, it sets APP_TAG}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Sign-in. This service is also the one-off container of migrations and
      # demo data (crm-deploy), so all of them get the same settings.
      # Secrets and the owner: from .env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}
      # Not secret: the address of the app and the sender of the emails
      BETTER_AUTH_URL: https://app.vupsen.space
      MAIL_FROM: "Личная CRM <noreply@mail.crm.vupsen.space>"
    ports:
      # nginx proxies app.vupsen.space here
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

volumes:
  db-data:
