name: personal-crm

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only; 5432 on this machine is taken by a system PostgreSQL
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends locally; nothing leaves this machine
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      # Without this Mailpit looks up the name of every client first, and the
      # SMTP greeting comes ~8 seconds late, longer than Nodemailer waits
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      # SMTP for the app and the tests, web page with the received emails
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
