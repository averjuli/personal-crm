# Build one image per commit, then deploy it to staging and prod in order.
# Deploy logic stays in deploy/crm-deploy.sh. Secrets: DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  upload-deploy-scripts:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: upload-deploy-scripts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host server
            HostName 153.76.175.28
            HostKeyAlias app.vupsen.space
            User crmapp
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ServerAliveInterval 30
          EOF

      - name: Copy deploy scripts to the server
        run: tar -C deploy -cz . | ssh server upload

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-staging:
    needs: upload-deploy-scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host server
            HostName 153.76.175.28
            HostKeyAlias app.vupsen.space
            User crmapp
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ServerAliveInterval 30
          EOF

      - name: Deploy staging
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh server deploy staging "$GITHUB_SHA"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-prod:
    needs: [upload-deploy-scripts, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host server
            HostName 153.76.175.28
            HostKeyAlias app.vupsen.space
            User crmapp
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ServerAliveInterval 30
          EOF

      - name: Deploy prod
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh server deploy prod "$GITHUB_SHA"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
