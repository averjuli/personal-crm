# Every pull request: lint, format, types, Vitest, Playwright and the image build.
# main is protected: a PR merges only when all these jobs are green.
name: CI

on:
  pull_request:

# A new push to the PR cancels the run for the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, types, Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      # Logic tests run against a real database; they create crm_test next to it
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database, not a secret
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

  e2e:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # A real database, as locally: compose.yaml uses the same image
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database, not a secret; the tests create crm_e2e next to it
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Microsoft Edge is preinstalled on GitHub's Ubuntu runners
      - name: Playwright
        run: pnpm test:e2e

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only: deploy.yml pushes the image after merge to main
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
